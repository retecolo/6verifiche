[project]
name = "lab-automation"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "nornir>=3.4",
  "nornir-netmiko>=1.0",
  "nornir-utils>=0.2",
  "netmiko>=4.3",
  "jinja2>=3.1",
  "click>=8.1",
  "pyyaml>=6.0",
]

[project.scripts]
lab-push = "run:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["run.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
