services:
  traefik:
    image: traefik:v3.3
    restart: unless-stopped
    ports:
      # Bind exclusively on IPv6 — dual-stack hosts also accept IPv4-mapped connections.
      - "[::]:80:80"
      - "[::]:443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik/traefik.yml:/traefik.yml:ro
      - traefik-certs:/letsencrypt
    networks:
      - v6net

  app:
    build:
      context: .
      dockerfile: Dockerfile
      network: host
    restart: unless-stopped
    # No direct port exposure — Traefik handles all ingress.
    environment:
      NODE_ENV: production
      HOSTNAME: "::"
      PORT: "3000"
      DATABASE_URL: "file:/data/prod.db"
      # ── Auth (choose one mode) ──────────────────────────────────────────────
      # AUTH_MODE: none        # default — open access (trusted network / dev)
      # AUTH_MODE: basic       # HTTP Basic Auth — works with curl -u user:pass
      # AUTH_MODE: cookie      # login page + signed session cookie
      AUTH_MODE: "none"
      AUTH_USER: "admin"
      AUTH_PASS: "changeme"
      AUTH_SECRET: "replace-with-a-long-random-string-32-chars-min"
    volumes:
      # Persist the SQLite database outside the container
      - db-data:/data
    networks:
      - v6net
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.app.rule=Host(`yourdomain.example`)"
      - "traefik.http.routers.app.entrypoints=websecure"
      - "traefik.http.routers.app.tls.certresolver=letsencrypt"
      - "traefik.http.services.app.loadbalancer.server.port=3000"

networks:
  v6net:
    # Explicit name prevents the Compose project-prefix so traefik.yml can
    # reference it directly regardless of how the stack is invoked.
    name: v6net
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:c0ff:ee::/64"

volumes:
  db-data:
  traefik-certs:
